<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaaya Dodger - Le Chaaya</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Press Start 2P', cursive; }
  
  :root {
    --bg-primary: #FFF8E7;
    --bg-secondary: #F5EDE0;
    --text-primary: #4A4A4A;
    --text-secondary: #6B6B6B;
    --accent-pink: #FFB3D9;
    --accent-blue: #B3E5FC;
    --accent-yellow: #FFFACD;
    --game-bg: #FFFFFF;
    --border: #D4A574;
  }
  
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1A1A2E;
      --bg-secondary: #16213E;
      --text-primary: #E8E8E8;
      --text-secondary: #C0C0C0;
      --accent-pink: #FF69B4;
      --accent-blue: #00CED1;
      --accent-yellow: #FFD700;
      --game-bg: #000000;
      --border: #E8C89F;
    }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function TeaGame() {
      const [firstLoadShown, setFirstLoadShown] = useState(() => {
        try { return JSON.parse(localStorage.getItem('chaayadodger_intro_shown')) || false; } catch { return false; }
      });
      const [gameState, setGameState] = useState(firstLoadShown ? 'start' : 'intro');
      const [drinksCollected, setDrinksCollected] = useState(0);
      const [lives, setLives] = useState(5);
      const gameRef = useRef(null);
      const gameDataRef = useRef({
        playerX: 150,
        objects: [],
        drinksCollected: 0,
        lives: 5,
        gameSpeed: 2,
        spawnRate: 0.035,
        objectIdCounter: 0,
        dropsCount: 0,
      });

      const GAME_WIDTH = 300;
      const GAME_HEIGHT = 400;
      const PLAYER_SIZE = 40;
      const PLAYER_Y = GAME_HEIGHT - 50;

      const [frameTriggger, setFrameTrigger] = useState(0);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (gameState !== 'playing') return;
          if (e.key === 'ArrowLeft') {
            gameDataRef.current.playerX = Math.max(0, gameDataRef.current.playerX - 20);
          } else if (e.key === 'ArrowRight') {
            gameDataRef.current.playerX = Math.min(GAME_WIDTH - PLAYER_SIZE, gameDataRef.current.playerX + 20);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [gameState]);

      useEffect(() => {
        if (gameState !== 'playing') return;
        let animationId;
        const gameLoop = () => {
          const data = gameDataRef.current;
          if (Math.random() < data.spawnRate) {
            data.dropsCount += 1;
            let type;
            if (data.dropsCount % 100 === 0) {
              type = 'life';
            } else {
              type = Math.random() > 0.4 ? 'drink' : 'snack';
            }
            data.objects.push({
              id: data.objectIdCounter++,
              x: Math.random() * (GAME_WIDTH - 25),
              y: -25,
              width: 25,
              height: 25,
              type,
            });
          }
          data.objects = data.objects.filter((obj) => {
            obj.y += data.gameSpeed;
            return obj.y < GAME_HEIGHT;
          });
          data.objects = data.objects.filter((obj) => {
            const colliding = obj.x + obj.width / 2 > data.playerX && obj.x + obj.width / 2 < data.playerX + PLAYER_SIZE && obj.y + obj.height / 2 > PLAYER_Y - 5 && obj.y + obj.height / 2 < PLAYER_Y + PLAYER_SIZE;
            if (colliding) {
              if (obj.type === 'drink') {
                data.drinksCollected += 1;
              } else if (obj.type === 'snack') {
                data.lives -= 1;
              } else if (obj.type === 'life') {
                data.lives = Math.min(10, data.lives + 1);
              }
              
              if (data.drinksCollected % 5 === 0) {
                data.gameSpeed += 0.3;
                data.spawnRate = Math.min(0.035, data.spawnRate + 0.002);
              }
              
              if (data.lives <= 0) {
                setGameState('gameOver');
                return false;
              }
              return false;
            }
            return true;
          });
          setDrinksCollected(data.drinksCollected);
          setLives(data.lives);
          setFrameTrigger(prev => prev + 1);
          animationId = requestAnimationFrame(gameLoop);
        };
        animationId = requestAnimationFrame(gameLoop);
        return () => cancelAnimationFrame(animationId);
      }, [gameState]);

      const handleStart = () => {
        gameDataRef.current = { playerX: 130, objects: [], drinksCollected: 0, lives: 5, gameSpeed: 2, spawnRate: 0.035, objectIdCounter: 0, dropsCount: 0 };
        setDrinksCollected(0);
        setLives(5);
        setGameState('playing');
      };

      const handleButtonMove = (direction) => {
        if (gameState !== 'playing') return;
        const step = 25;
        if (direction === 'left') {
          gameDataRef.current.playerX = Math.max(0, gameDataRef.current.playerX - step);
        } else {
          gameDataRef.current.playerX = Math.min(GAME_WIDTH - PLAYER_SIZE, gameDataRef.current.playerX + step);
        }
      };

      const shareScore = () => {
        const text = `I collected ${drinksCollected} chaaya in Chaaya Dodger! Can you beat my score? 🫖☕ chaayadodger.lechaaya.in`;
        if (navigator.share) {
          navigator.share({ title: 'Chaaya Dodger', text: text });
        } else {
          navigator.clipboard.writeText(text);
          alert('Score copied! Paste it in your Instagram story.');
        }
      };

      return (
        <div style={{ background: 'var(--bg-primary)', minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '20px', fontFamily: "'Courier New', monospace" }}>
          <div style={{ color: 'var(--text-primary)', marginBottom: '20px', textAlign: 'center' }}>
            <h1 style={{ margin: '0 0 10px 0', fontSize: '32px', fontWeight: 'bold' }}>Fill Your Chaaya Glass</h1>
            <p style={{ margin: '0', opacity: 0.7 }}>Collect drinks ☕ • Avoid snacks 🍪</p>
          </div>
          <div style={{ width: `${GAME_WIDTH}px`, height: `${GAME_HEIGHT}px`, background: 'var(--game-bg)', border: '3px solid var(--border)', position: 'relative', overflow: 'hidden', marginBottom: '20px', boxShadow: '0 8px 16px rgba(0,0,0,0.3)' }}>
            <div style={{ position: 'absolute', right: '8px', top: '10px', display: 'flex', gap: '4px', zIndex: 10 }}>
              {[...Array(lives)].map((_, i) => (
                <div key={i} style={{ width: '16px', height: '16px', fontSize: '14px' }}>❤️</div>
              ))}
            </div>
            <div style={{ position: 'absolute', top: '10px', left: '10px', color: 'var(--text-primary)', fontSize: '14px', fontWeight: 'bold', zIndex: 10 }}>Chaaya: {drinksCollected}</div>
            <div style={{ position: 'absolute', left: `${gameDataRef.current.playerX}px`, top: `${PLAYER_Y}px`, width: `${PLAYER_SIZE}px`, height: `${PLAYER_SIZE}px`, zIndex: 100 }}>
              <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAB90lEQVR4AexT3U3DYAz0ITEBE8AcsAawAgwEMxTGgDl44RUmACnc2XWTNE6TIBBCSvTd9+Pfs+se2R9/K4G1A/+qAw3/MN8FXes1twNKbE3D4+TFrh4+Ft2Zmo7ci3WIgJwcnpjOAKx5O7XN5bFdP36avZ8N7kBrA8SdrlqKpbOHMQJunImVzO+sHoAHEonsxObmte0KtUDYGO13vpRXqyLgybvOSqZAqlhEEin3rpAEwIr5M6Ve9iIHbAkVDCoCUU231XRUMgUGYAAoMZ8DyQG++XNILwUAt/E35ZRhCx79VRJI1gqgBHRRAB7Fujk3SxTqKVFJQK2To7ddlw5ESuiIBlfphYGiEFQEvFoF2Kse/HohcHtx+A0P5VvPsPOoCLi6qL5Rq5U04YZ7W+p0yp7qGGpeqjVGAHvVe3IPcP/sx+SWdpoPzuuY/RgB2detU0AFn4LsFGUChwh0XWFKmBIFn0Lahl9dDG3mEqCpBQkFFCQZg/QJo5+Nf0sIKEpUour1GkOrD/sxO8qXENA0t8NI51zN3VNe2zNIhE8rHdzmEigTK1omz1OyHloiPXE+5hII+whmu4HU7xya2POdZ9qHttznEtgfwHibgZ82h5nt5E5SRATJrf7mEpC3BiqR7zznyGU7wBICA+efEKwE1g78egemBvULAAD//yYndasAAAAGSURBVAMAjakMULgmfZ8AAAAASUVORK5CYII=" style={{ width: '100%', height: '100%' }} />
            </div>
            {gameDataRef.current.objects.map((obj) => (
              <div key={obj.id} style={{ position: 'absolute', left: `${obj.x}px`, top: `${obj.y}px`, width: `${obj.width}px`, height: `${obj.height}px`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                {obj.type === 'drink' && (
                  <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAA0UlEQVR4AexUwQ3CMAwMbMQEfJiENzPwYAbeTMKHCXiwAAswQ7Ar+dU6Prerequisites+Pj43oHm+ohgtw5I84kossnVrQMRlUMckAPH67MwNMbP91cYHL883oXBawSQAIRobk4KsBxoXiHDdmivJcD4xvJwCkgHXA5wN5wCdz6B91i6BHjJkfzNCJCm4pkRA8pmHICqmUqy3v0BAAD//xCnXKkAAAAGSURBVAMAUnFTQRIY0bEAAAAASUVORK5CYII=" style={{ width: '100%', height: '100%' }} />
                )}
                {obj.type === 'snack' && (
                  <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAACTUlEQVR4AeyVsU4cMRCGZyOFInVSQApqoEiTKHmI1GnS5A0ipcwDpIzgDahBdEi8AgjoEFdTAAWUiAKKZb4Rcxobr3cPFtFw8n9j/x7P/9vevXsjL/x5NTD2CbR6ow7t9rcxDbTt7Z44VBojGuptLAMmfnZ2IY7Tk22Ue02MZQCxBzjYXYermhjVwMLCBwRnwlgGmubt16Jw3ymMZaAoPj//vshH8lkNRKGu/mMM8FBFdNUexM9iwET9PfeoKsZrfFQbasDec0RzlRJHzvn5pQD6NQwxYOIU4UkvgTlweDgxUYQ/f/slDuYUnJSGtPUZSMR1aZNBNv4vGZS35qKcTA5NeGCiz4CuEWHXIoK4hI8VW16aEwCPOBH4T7JHOAxptHUardUMTHdvmYWv9uSLrCzPJTN+Ih8XvwvwSYx4P8aaAcvr2j3ilqBfbuJo55OdBieCEZ1KTDDOUTUwRJyCzeK+IE4fHE9uCEXk11AzwJ0DL8TdtXHnTOTicODHnwkhrre/asiI3ICJxATtG4cw0PG0lcRLu+dZ4NWcLgydaKD9/e+dAJ03USKiQPtJq4lnu09OISmig2hAhyKrP1cEQYeR4QthEO+cad95Js5Ugvy5igaatb/XQvHNrStxMI5AGMSqQ8VL1xANUJPjatgFgOB1AogCOAfCgPF9PusZDkZuwBdSKDGCUA5PHip+/0tJbV8qXQY8gWQz4oRHRB3Kkaehu5XEye4zQA4wEy5IVBJRhw6rrTNvqAGqexGPcE/GLAaeLFYq8OwGSqKRuwMAAP//MARDjQAAAAZJREFUAwCD5yVQZrs1jQAAAABJRU5ErkJggg=" style={{ width: '100%', height: '100%' }} />
                )}
                {obj.type === 'life' && (
                  <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAABZElEQVR4AeyTAWrDMBRDs7EL7Dw7/86zCwxaP+EExf1xf5xCS8mIZldf0hcp/Zye/HcWON/Ay7+BS/mRRCh0+ERauFAM2XsDMv5+f00OTAWaldMfca7lXgWa1fvq2CoggwUsJuOkqQPdbVbpSeXrB2nqfTmiAhJGYbPLZmiBL5ply9noF55LW+BuGCZgod3laIHptQMOtAVSYRgBoYB7BpH2pkAm6JGamwI/f/+PzF9lRdltgQ8ckRD+CCxTO+astgC8BGaAOwTLUraHRQWYS2hGuCFYhjLbkK0C6GSwALhdMK+yInOvAHoZLQguBfMoY8t0rwA+BVggXBemlbcnzhTAryALhgthGnlCkZHZAlgUaAvgVrCZtKvhxoc9BYhQsC2CE4yTRmTi394CRGqBLZzsrhmiLEYKkK1FLAYQBeLKuesZLcASX+h3ZmkcKcASFgPuQzhaYGipm84C7/8G/PuO7lcAAAD//zvaP84AAAAGSURBVAMAkjBiQdNQ3/IAAAAASUVORK5CYII=" style={{ width: '100%', height: '100%' }} />
                )}
              </div>
            ))}
            {gameState === 'gameOver' && (
              <div style={{ position: 'absolute', inset: 0, background: 'rgba(0, 0, 0, 0.9)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', zIndex: 200, color: 'var(--text-primary)', textAlign: 'center' }}>
                <div style={{ fontSize: '28px', fontWeight: 'bold', marginBottom: '8px' }}>Game Over!</div>
                <div style={{ fontSize: '14px', marginBottom: '20px', opacity: 0.8 }}>Whoa, there's a new connoisseur in town! 🎉</div>
                <div style={{ fontSize: '32px', marginBottom: '20px', color: 'var(--accent-pink)', fontWeight: 'bold' }}>{drinksCollected} ☕</div>
                <div style={{ fontSize: '12px', marginBottom: '20px', opacity: 0.7 }}>chaaya collected</div>
                <button onClick={handleStart} style={{ padding: '10px 20px', background: 'var(--accent-pink)', color: 'var(--text-primary)', border: 'none', borderRadius: '4px', fontWeight: 'bold', cursor: 'pointer', marginBottom: '10px' }}>Play Again</button>
                <button onClick={() => shareScore()} style={{ padding: '10px 20px', background: 'var(--accent-blue)', color: 'var(--text-primary)', border: 'none', borderRadius: '4px', fontWeight: 'bold', cursor: 'pointer', fontSize: '14px' }}>Share Score</button>
              </div>
            )}
            {gameState === 'win' && (
              <div style={{ position: 'absolute', inset: 0, background: 'rgba(0, 0, 0, 0.85)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', zIndex: 200, color: 'var(--text-primary)', textAlign: 'center' }}>
                <div style={{ fontSize: '28px', fontWeight: 'bold', marginBottom: '10px' }}>Glass Full! 🎉</div>
                <div style={{ fontSize: '14px', marginBottom: '10px' }}>You collected {drinksCollected} chaaya ☕</div>
                <div style={{ fontSize: '12px', marginBottom: '15px', opacity: 0.8 }}>Chai Champion Status</div>
                <button onClick={handleStart} style={{ padding: '10px 20px', background: 'var(--accent-pink)', color: 'var(--text-primary)', border: 'none', borderRadius: '4px', fontWeight: 'bold', cursor: 'pointer' }}>Play Again</button>
              </div>
            )}
            {gameState === 'intro' && (
              <div style={{ position: 'absolute', inset: 0, background: 'rgba(0, 0, 0, 0.95)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', zIndex: 200, color: 'var(--text-primary)', textAlign: 'center', padding: '20px', overflowY: 'auto' }}>
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAACl0lEQVR4AcSSMY4VMQyGbSQaKiQkJEqQoOEKgDgFcIWFgp4D0FMAZ1i4BAJOARINHYKWZlea9eeM32QyyUze01vtU/6x49i///jlmlzxr1fAYDoPhZW2V48AGsswmLn1S55/OtvLt9ZWaN/GagmgyOGNrVhVZfh7V06fXZcXn89F/t1b+KpTjmryrZQFF3aBmgBPjsY0c99ur6pOgIiYxOnJ72kqdqqacsTyd7UWb61SgDfPi2kGETdGSCDiPhUToWo3tr8pzslHnOooqKGgFJBuk4/aCmkGsaqKqlpE/B0QV7W9/R2cc6CqnuN7i1tMR5hZroWAUA0BDawEAjOVdfJIJFA57gktBDA6Cn3sOBkQBbLQwuUcLA4agVKA3xaC4vZqvxmFvny8vlen8s8ssdiUAvy4cvuBUdM04InFJ86w5NtxetTmtFZNgBa39+ZO8PG7m81P5PE+7L2u5dcEkF8fHYSQb4E8WDrQEpCXqtAwIpBvIXJTXf0yY06PAFKTCAgBkRY4D4isNhf79Qqw1JGM27NrYTrfbA5FrwBe8/QYqRwxfPg2eplJIlJNFq65PQKqjSGL5mGJzTAJmYXzzZqA+Q0SmeweJP9zzhT7sJGfcuBKXvFdEyCvnjxweFOIDcTYY1VVVBOe3r/t4sKSA3yfmlZFtATMkmkWgAs/LH40yS0+IC8sfomaAG8OcZl8hL1z5zw1AWnsedbov//6Q8C43ZmHd27u/JbTmkJVACQ0AvgA//XbG7hHRVMAXWhIY/wt9EyhxtEUwBt49+a/hAgse+I1ImKHiGgKgDDQ0zxy9xWxKoDbcusgvwy7KuDQhvtMoSqAhxdAREwhYj32y88/UgKuEjUBakmXCaOfVk3AdHoEb4viAgAA///DSnicAAAABklEQVQDAHVCcFDdyUpsAAAAAElFTkSuQmCC" style={{ width: '120px', height: '120px', marginBottom: '20px' }} />
                <div style={{ fontSize: '14px', fontWeight: 'bold', marginBottom: '15px' }}>Thavala Thangappan</div>
                <div style={{ fontSize: '11px', lineHeight: '1.6', marginBottom: '20px', maxWidth: '280px', opacity: 0.9 }}>
                  Not a typical frog. Thavala loves chaaya (can't blame them) and absolutely hates bananas (can they be blamed?). But the monsoons have arrived, and chaaya is scarce. Help them collect every drop, and they'll owe you forever.
                </div>
                <button onClick={() => { setFirstLoadShown(true); try { localStorage.setItem('chaayadodger_intro_shown', 'true'); } catch {} setGameState('start'); }} style={{ padding: '12px 24px', background: 'var(--accent-pink)', color: 'var(--text-primary)', border: 'none', borderRadius: '4px', fontWeight: 'bold', cursor: 'pointer', fontSize: '14px' }}>Help Thavala</button>
              </div>
            )}
              <div style={{ position: 'absolute', inset: 0, background: 'rgba(0, 0, 0, 0.85)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', zIndex: 200, color: 'var(--text-primary)', textAlign: 'center' }}>
                <div style={{ fontSize: '20px', fontWeight: 'bold', marginBottom: '10px' }}>Chaaya Dodger</div>
                <div style={{ fontSize: '12px', marginBottom: '20px', opacity: 0.8, lineHeight: '1.6' }}>Collect drinks ☕<br />Avoid snacks 🍪<br />Fill the glass to win!</div>
                <button onClick={handleStart} style={{ padding: '12px 24px', background: 'var(--accent-pink)', color: 'var(--text-primary)', border: 'none', borderRadius: '4px', fontWeight: 'bold', cursor: 'pointer', fontSize: '16px' }}>Start Game</button>
              </div>
            )}
          </div>
          <div style={{ textAlign: 'center', color: 'var(--text-primary)', marginBottom: '20px' }}>
            <p style={{ margin: '0 0 10px 0', fontSize: '12px', opacity: 0.8 }}>Use arrow keys or buttons to move</p>
            <div style={{ display: 'flex', gap: '10px', justifyContent: 'center' }}>
              <button onClick={() => handleButtonMove('left')} style={{ padding: '10px 20px', background: 'var(--accent-pink)', color: 'var(--text-primary)', border: 'none', borderRadius: '4px', fontWeight: 'bold', cursor: 'pointer', fontSize: '16px' }}>← Left</button>
              <button onClick={() => handleButtonMove('right')} style={{ padding: '10px 20px', background: 'var(--accent-pink)', color: 'var(--text-primary)', border: 'none', borderRadius: '4px', fontWeight: 'bold', cursor: 'pointer', fontSize: '16px' }}>Right →</button>
            </div>
          </div>
          <div style={{ color: 'var(--text-primary)', fontSize: '12px', opacity: 0.7, textAlign: 'center', maxWidth: '300px' }}>Made for Le Chaaya ☕ <br />Fill your glass. Chaaya Champion vibes.</div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<TeaGame />);
  </script>
</body>
</html>
